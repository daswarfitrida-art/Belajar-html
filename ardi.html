<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komentar Publik</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #1e1e2f 0%, #2d1b4e 50%, #4a1e5c 100%);
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    justify-content: center;
    color: #e0e0e0;
  }

  .container { width: 100%; max-width: 740px; }

  .card {
    background: rgba(30, 30, 47, 0.85);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    margin-bottom: 20px;
    backdrop-filter: blur(12px);
  }

  h1 {
    font-size: 26px;
    margin-bottom: 6px;
    background: linear-gradient(135deg, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle { color: #888; margin-bottom: 22px; font-size: 14px; }

  .input-group { display: flex; flex-direction: column; gap: 12px; }

  input, textarea {
    width: 100%;
    padding: 14px 18px;
    border: 2px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    font-size: 15px;
    font-family: inherit;
    transition: all .25s;
    background: rgba(255,255,255,0.04);
    color: #e0e0e0;
  }

  input::placeholder, textarea::placeholder { color: #666; }

  input:focus, textarea:focus {
    outline: none;
    border-color: #a78bfa;
    background: rgba(167,139,250,0.08);
    box-shadow: 0 0 0 4px rgba(167,139,250,0.12);
  }

  textarea { resize: vertical; min-height: 100px; }

  .char-count {
    font-size: 12px;
    color: #666;
    text-align: right;
    margin-top: -6px;
  }

  .btn {
    padding: 13px 26px;
    background: linear-gradient(135deg, #a78bfa, #f472b6);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s, opacity .2s;
    align-self: flex-end;
  }

  .btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(167,139,250,0.45);
  }

  .btn:disabled { opacity: .35; cursor: not-allowed; }

  .comments-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .comments-header h2 { color: #e0e0e0; font-size: 20px; }

  .comments-count {
    background: linear-gradient(135deg, #a78bfa, #f472b6);
    color: #fff;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 700;
  }

  .comment {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    border-left: 4px solid #a78bfa;
    animation: slideIn .35s ease;
    transition: background .2s;
  }

  .comment:hover { background: rgba(255,255,255,0.06); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .comment-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    gap: 12px;
  }

  .comment-author {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(135deg, #a78bfa, #f472b6);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    flex-shrink: 0;
  }

  .name-time { min-width: 0; }

  .comment-name {
    font-weight: 700;
    color: #e0e0e0;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .comment-time { font-size: 12px; color: #777; margin-top: 2px; }

  .comment-text {
    color: #c8c8d0;
    line-height: 1.65;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    padding-left: 52px;
  }

  .comment-actions {
    margin-top: 12px;
    padding-left: 52px;
    display: flex;
    gap: 8px;
  }

  .delete-btn {
    background: transparent;
    color: #f87171;
    border: 1px solid rgba(248,113,113,0.3);
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    transition: all .2s;
  }

  .delete-btn:hover {
    background: #f87171;
    color: #1e1e2f;
    border-color: #f87171;
  }

  .empty {
    text-align: center;
    color: #666;
    padding: 40px 20px;
    font-style: italic;
  }

  @media (max-width: 500px) {
    body { padding: 20px 12px; }
    .card { padding: 22px 18px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="card">
    <h1>💬 Kolom Komentar</h1>
    <p class="subtitle">Tulis sesuatu yang menarik ✨</p>

    <div class="input-group">
      <input type="text" id="nameInput" placeholder="Nama kamu..." maxlength="30">
      <textarea id="commentInput" placeholder="Tulis komentar..." maxlength="300"></textarea>
      <div class="char-count"><span id="charCount">0</span>/300</div>
      <button class="btn" id="submitBtn" onclick="addComment()">Kirim Komentar 🚀</button>
    </div>
  </div>

  <div class="card">
    <div class="comments-header">
      <h2>Komentar</h2>
      <span class="comments-count" id="count">0</span>
    </div>
    <div id="commentsList"></div>
  </div>

</div>

<script>
  const STORAGE_KEY = 'comments_v3';
  let comments = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

  const nameInput = document.getElementById('nameInput');
  const commentInput = document.getElementById('commentInput');
  const charCount = document.getElementById('charCount');
  const submitBtn = document.getElementById('submitBtn');
  const commentsList = document.getElementById('commentsList');
  const countEl = document.getElementById('count');

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(comments));
  }

  function getInitial(name) {
    return name.trim().charAt(0).toUpperCase() || '?';
  }

  function render() {
    countEl.textContent = comments.length;

    if (comments.length === 0) {
      commentsList.innerHTML = '<p class="empty">Belum ada komentar. Jadilah yang pertama! ✨</p>';
      return;
    }

    // Render pakai innerHTML mentah, sesuai permintaan tanpa anti-XSS
    commentsList.innerHTML = comments.map((c, i) => `
      <div class="comment">
        <div class="comment-header">
          <div class="comment-author">
            <div class="avatar">${getInitial(c.name)}</div>
            <div class="name-time">
              <div class="comment-name">${c.name}</div>
              <div class="comment-time">${c.time}</div>
            </div>
          </div>
        </div>
        <p class="comment-text">${c.text}</p>
        <div class="comment-actions">
          <button class="delete-btn" onclick="deleteComment(${i})">Hapus</button>
        </div>
      </div>
    `).join('');
  }

  function addComment() {
    const name = nameInput.value.trim();
    const text = commentInput.value.trim();

    if (!name || !text) {
      alert('Isi nama dan komentar dulu ya!');
      return;
    }

    comments.unshift({
      name: name,
      text: text,
      time: new Date().toLocaleString('id-ID', {
        day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
      })
    });

    save();
    nameInput.value = '';
    commentInput.value = '';
    charCount.textContent = '0';
    submitBtn.disabled = true;
    render();
  }

  function deleteComment(index) {
    if (confirm('Hapus komentar ini?')) {
      comments.splice(index, 1);
      save();
      render();
    }
  }

  function updateForm() {
    const nameOk = nameInput.value.trim().length > 0;
    const textOk = commentInput.value.trim().length > 0;
    submitBtn.disabled = !(nameOk && textOk);
    charCount.textContent = commentInput.value.length;
  }

  nameInput.addEventListener('input', updateForm);
  commentInput.addEventListener('input', updateForm);

  nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      commentInput.focus();
    }
  });

  submitBtn.disabled = true;
  render();
</script>
</body>
</html>
